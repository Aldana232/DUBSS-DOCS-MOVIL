<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171a23">
  <title>Sin conexión — DUBSS</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; text-align: center;
           background: radial-gradient(circle at 20% 10%, #d21115 0%, #8a0c0f 45%, #171a23 100%); }
    main { max-width: 340px; }
    .escudo { width: 88px; height: 88px; border-radius: 50%; background: #fff; margin: 0 auto; display: flex;
              align-items: center; justify-content: center; font-weight: 800; color: #d21115; letter-spacing: .5px;
              box-shadow: 0 10px 30px rgba(0,0,0,.35); }
    h1 { margin: 20px 0 8px; font-size: 1.35rem; }
    p { margin: 0 0 14px; line-height: 1.5; color: #fecaca; font-size: .95rem; }
    button { border: 0; border-radius: 12px; padding: 13px 26px; font-size: 1rem; font-weight: 700; color: #8a0c0f; background: #fff; width: 100%; }
    small { display: block; margin-top: 16px; color: #fca5a5; font-size: .8rem; }
  </style>
</head>
<body>
  <main>
    <div class="escudo">DUBSS</div>
    <h1>No se pudo conectar</h1>
    <p>La aplicación necesita llegar al servidor de la DUBSS. Revisa tu conexión a internet o a la red Wi-Fi de la universidad.</p>
    <p>Si estás llenando una planilla, <b>no pierdes nada</b>: lo que ya anotaste queda guardado en este celular y se envía solo cuando vuelva la conexión.</p>
    <button type="button" id="reintentar">Reintentar</button>
    <small id="estado" role="status"></small>
  </main>
  <script>
    // Vuelve a entrar solo apenas haya conexión, y también al tocar «Reintentar».
    var estado = document.getElementById("estado");
    var ENTRADA = "__DUBSS_ENTRADA__";   // la reemplaza build-apk.ps1 con la dirección real del sistema
    function volver() { estado.textContent = "Conectando…"; location.href = ENTRADA; }
    document.getElementById("reintentar").addEventListener("click", volver);
    window.addEventListener("online", volver);
    setInterval(function () { if (navigator.onLine) volver(); }, 8000);
  </script>
</body>
</html>
